[package]
name = "copyloom"
version = "0.1.38"
description = "Personlig clipboard-historik för Windows"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"

[lib]
name = "clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
arboard = "3.6"
base64 = "0.22"
rusqlite = { version = "0.38", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25.1"
window-vibrancy = "0.8.1"
clipboard-win = { version = "5.4", features = ["monitor"] }
# Same version Tauri already builds; only the Windows OCR projections and MSAA (caret position) are added.
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Time", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

# Optimize our pixel loops in debug builds without rebuilding all dependencies.
[profile.dev.package.copyloom]
opt-level = 2

# PNG/deflate are ~50x slower unoptimized (4K screenshot: 3.9 s instead of 0.1 s in debug test builds).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
